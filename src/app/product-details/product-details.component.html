<div class="modal-overlay" (click)="fecharModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="fecharModal()">&times;</button>
    
    <div class="details-layout">
      <div class="image-side">
        <img [src]="produto.imagem" [alt]="produto.nome">
      </div>
      
      <div class="info-side">
        <h2>{{ produto.nome }}</h2>
        <p class="animal-type">Para: {{ produto.tipoAnimal }}</p>
        
        <p class="desc">{{ produto.descricao }}</p>
        
        <div class="price-area">
          <p class="total-price">Total: R$ {{ (produto.preco * quantidade).toFixed(2) }}</p>
          @if (produto.promocao) {
            <span class="badge promocao">Aproveite a promoção!</span>
          }
        </div>
        
        <div class="purchase-area">
          <div class="quantity-controls">
            <button (click)="diminuirQuantidade()" [disabled]="quantidade <= 1">-</button>
            <span>{{ quantidade }}</span>
            <button (click)="aumentarQuantidade()">+</button>
          </div>
          
          <button class="btn-comprar" (click)="comprar()">
            Adicionar ao Carrinho
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
