<section class="game-list-section">
  <h2>Catálogo de Jogos</h2>
  
  @if (jogos.length > 0) {
    <div class="games-grid">
      @for (jogo of jogos; track jogo.id) {
        <app-game-card 
          [jogo]="jogo" 
          (selecionado)="selecionarJogo($event)">
        </app-game-card>
      }
    </div>
  } @else {
    <p class="no-games">Nenhum jogo cadastrado no momento.</p>
  }
</section>

@if (jogoSelecionado) {
  <app-game-details 
    [jogo]="jogoSelecionado" 
    (fechar)="fecharDetalhes()">
  </app-game-details>
}
