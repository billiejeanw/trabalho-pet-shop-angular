<article class="game-card">
  <div class="image-container">
    <img [src]="jogo.imagem" [alt]="jogo.nome">
    @if (!jogo.disponivel) {
      <span class="badge indisponivel">Indisponível</span>
    }
  </div>
  
  <div class="card-content">
    <h3>{{ jogo.nome }}</h3>
    <p class="description">{{ jogo.descricao }}</p>
    
    <div class="actions">
      <button 
        class="btn-detalhes" 
        [disabled]="!jogo.disponivel"
        (click)="verDetalhes()">
        Ver Detalhes
      </button>
      
      <button 
        class="btn-favorito" 
        [class.ativo]="jogo.favorito"
        (click)="alternarFavorito()">
        {{ jogo.favorito ? '❤️' : '🤍' }}
      </button>
    </div>
  </div>
</article>
